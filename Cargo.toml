[package]
name = "openarm-sim-native"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socketcan = { version = "4", default-features = false }

[build-dependencies]
bindgen = "0.73"

[profile.release]
debug = 1
