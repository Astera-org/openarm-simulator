[package]
name = "openarm-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
damiao-simulator = { path = "../damiao-simulator-rs" }
openarm-simulator-core = { path = "../openarm-simulator-core-rs" }
mujoco = { path = "../mujoco-rs" }
damiao-can = { path = "../damiao-can-rs" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
mime = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
socket2 = { version = "0.6", features = ["all"] }
socketcan = { version = "4", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "timeout"] }

[dev-dependencies]
openarm-simulator-client = { path = "../openarm-simulator-client-rs" }
openarm-test-model = { path = "tests/model" }
tempfile = "3"
