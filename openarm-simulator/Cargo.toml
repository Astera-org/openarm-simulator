[package]
name = "openarm-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
socket2 = { version = "0.6", features = ["all"] }
socketcan = { version = "4", default-features = false }
tokio = { version = "1", features = ["rt", "net", "time"] }

[build-dependencies]
bindgen = "0.73"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
openarm-test-model = { path = "tests/model" }
tempfile = "3"
