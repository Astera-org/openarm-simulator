[package]
name = "openarm-simulator-client-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
percent-encoding = "2"
openarm-simulator-core-rs = { path = "../openarm-simulator-core-rs" }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
libc = "0.2"
openarm-test-model = { path = "../openarm-simulator-rs/tests/model" }
