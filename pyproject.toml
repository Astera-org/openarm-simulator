[project]
name = "openarm-simulator"
version = "0.1.0"
description = "MuJoCo virtual CAN motors with an HTTP administration API"
requires-python = ">=3.12,<3.13"
dependencies = ["mujoco==3.14.0", "numpy>=1.26", "openarm-can==1.4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
openarm-simulator = "openarm_simulator.service:main"
